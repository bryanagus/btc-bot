name: Bot Trading BTC Pro WITA

on:
  #schedule:
    # Menggunakan menit ke-13 untuk menghindari antrean server GitHub (biasanya padat di menit 00, 15, 30, 45, 50)
    # Ini akan sangat mengurangi masalah "Delay Antrean"
    #- cron: '13 * * * *' 
  workflow_dispatch: # Memungkinkan kamu menjalankan bot secara manual dari tombol "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Menginstal semua library sekaligus agar cepat, termasuk scikit-learn
          pip install pandas numpy matplotlib yfinance pytz requests scikit-learn

      - name: Run Script
        run: python main.py
        env:
          # Mengambil token dari GitHub Secrets agar aman dan tidak terekspos di public code
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
