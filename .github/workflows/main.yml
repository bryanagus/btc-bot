name: Bot Trading BTC Pro WITA

on:
  workflow_dispatch:

# --- PENGAMAN TABRAKAN (CONCURRENCY) ---
# Memastikan hanya ada 1 bot yang berjalan di satu waktu agar tidak bentrok saat save CSV
concurrency:
  group: bot-trading-group
  cancel-in-progress: false 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_TOKEN }} 
          fetch-depth: 1 # Meringankan beban unduhan

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Mengaktifkan Brankas Cache

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Run Script
        run: python main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Auto Save CSV & JSON to GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update Jurnal Prediksi AI [skip ci]"
          # PERBAIKAN: *.pkl dihapus dari auto-commit agar akun GitHub tidak kena bloat/banned
          file_pattern: 'ai_history_log.csv dashboard_data.json last_alert_state.json bot_system.log'

      # =========================================================
      # TAHAP 2: KIRIM DATA KE INFINITYFREE VIA FTP
      # =========================================================
      - name: 🚀 Upload ke Web InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            L-main-LSTM-super-heavy.py
            L-main-MLP-low-level.py
            main.py
            requirements.txt
            ai_history_log.csv
            README.md
            *.png
            *.pkl
            last_alert_state.json
            bot_system.log
