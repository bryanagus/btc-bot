name: Bot Trading BTC WITA

on:
  schedule:
    # Berjalan di menit ke-10 setiap jam (waktu server).
    # Contoh: 15:10 WITA, 16:10 WITA, 17:10 WITA, dst.
    - cron: '10 * * * *' 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib yfinance pytz requests

      - name: Run Script
        run: python main.py
